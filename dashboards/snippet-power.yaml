type: custom:power-flow-card-plus
entities:
  battery:
    state_of_charge: sensor.battery_soc
    entity:
      consumption: sensor.battery_discharge
      production: sensor.battery_charge
  grid:
    entity: sensor.octopus_energy_electricity_21l4171264_1012675233301_current_demand
    use_metadata: false
    secondary_info:
      color_value: false
      entity: sensor.current_electricity_rate_in_pence
      decimals: 2
      unit_white_space: false
      unit_of_measurement: p
    name: Grid
    display_zero_tolerance: 0
  solar:
    entity: sensor.pv1_power
    secondary_info:
      entity: sensor.solcast_pv_forecast_forecast_remaining_today
      unit_of_measurement: kWh
      decimals: 1
      display_zero: true
  home: {}
  individual:
    - entity: sensor.entertainment_monitor_ac_current_power_value
      name: TV/Xbox
      icon: mdi:television
    - entity: sensor.zappi_27008591_myenergi_zappi_27008591_power_ct_internal_load
      name: Zappi
      icon: mdi:ev-station
      display_zero: true
      secondary_info:
        entity: sensor.zappi_27008591_myenergi_zappi_27008591_plug_status
clickable_entities: true
display_zero_lines:
  mode: grey_out
  transparency: 50
  grey_color:
    - 189
    - 189
    - 189
use_new_flow_rate_model: true
base_decimals: 0
kilo_decimals: 1
min_flow_rate: 0.75
max_flow_rate: 6
max_expected_power: 2000
min_expected_power: 0.01
kilo_threshold: 1000
mega_threshold: 1000000
transparency_zero_lines: 0
sort_individual_devices: false
grid_options:
  columns: full
disable_dots: false
no_labels: false
allow_layout_break: true
