type: custom:power-flow-card-plus
entities:
  battery:
    state_of_charge: sensor.battery_soc
    entity:
      consumption: sensor.battery_discharge
      production: sensor.battery_charge
  grid:
    entity:
      consumption: sensor.grid_consumption
      production: sensor.feed_in
    use_metadata: false
    secondary_info:
      color_value: false
      entity: sensor.current_electricity_rate_in_pence
      unit_white_space: false
      unit_of_measurement: p
      decimals: 0
    name: Grid
    display_zero_tolerance: 50
  solar:
    entity: sensor.pv1_power
    secondary_info:
      entity: sensor.solcast_pv_forecast_forecast_remaining_today
      unit_of_measurement: kWh
      decimals: 1
      display_zero: true
  home: {}
  individual:
    - entity: sensor.zappi_27008591_myenergi_zappi_27008591_power_ct_internal_load
      name: Zappi
      icon: mdi:car-electric
      display_zero: true
      secondary_info:
        icon: ''
        color_value: false
        display_zero: true
        accept_negative: false
        unit_white_space: false
        template: >-
          "{{
          states('sensor.zappi_27008591_myenergi_zappi_27008591_plug_status') |
          replace('EV ', '') }}"
    - entity: sensor.shed_monitor_power
      icon: mdi:greenhouse
      name: Shed
clickable_entities: true
display_zero_lines:
  mode: transparency
  transparency: 50
  grey_color:
    - 189
    - 189
    - 189
  grey_out_circles: false
base_decimals: 0
kilo_decimals: 1
min_flow_rate: 0.75
max_flow_rate: 6
max_expected_power: 2000
min_expected_power: 0.01
kilo_threshold: 1000
mega_threshold: 1000000
transparency_zero_lines: 0
sort_individual_devices: false
grid_options:
  rows: auto
disable_dots: false
no_labels: false
allow_layout_break: false
flow_rate_model: duration
topology: standard
keep_trailing_zeros: true
