# lovelace_gen
type: custom:button-card
entity: sensor.{{ entity }}_local_temperature
show_name: false
show_state: true
show_icon: true
size: clamp(1.5em, 2.5vw, 2em)
icon: >
{% raw %}
  [[[
    return states['climate.{% endraw %}{{ entity }}{% raw %}']?.attributes?.hvac_action === 'heating'
      ? 'mdi:radiator'
      : 'mdi:radiator-off';
  ]]]
{% endraw %}
style:
  left: {{ x }}
  top: {{ y }}
styles:
  state:
    - font-size: >-
        [[[ return window.matchMedia('(max-width: 600px)').matches ? '0.65em' : '1em'; ]]]
  card:
    - border-color: transparent
    - background-color: transparent
    - text-shadow: -1px -1px 0 black, 1px -1px 0 black, -1px 1px 0 black, 1px 1px 0 black;
    - stroke: black;
    - stroke-width: 0.5px;
tap_action:
{% if popup is defined %}
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      title: {{ title }}
      content: !include {{ popup }}
{% else %}
  action: none
{% endif %}
hold_action:
  action: none
