# lovelace_gen
views:
  - title: Phone
    sections:
      - type: grid
        cards:
          - type: custom:tabdeck-card
            style: ios
            tab_display: active
            swipe: true
            swipe_mouse: true
            transition: slide
            grid_options:
              columns: full
            tabs:
              - name: Power
                icon: mdi:lightning-bolt
                card:
                  type: vertical-stack
                  cards:
                    - !include snippet-power.yaml
                    - !include snippet-solar-today.yaml
                    - !include snippet-solar-tomorrow.yaml
              - name: Downstairs
                icon: mdi:stairs-down
                card:
                  type: vertical-stack
                  cards: !include floorplan-downstairs.yaml
              - name: Upstairs
                icon: mdi:stairs-up
                card:
                  type: vertical-stack
                  cards: !include floorplan-upstairs.yaml
              - name: Who's Home
                icon: mdi:account
                card:
                  type: vertical-stack
                  cards:
                    - !include snippet-people.yaml
