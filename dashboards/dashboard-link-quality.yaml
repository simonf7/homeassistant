views:
  - title: Link Quality
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.router_linkquality
            triggers_update: all
            grid_options:
              columns: full
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            custom_fields:
              topology: |
                [[[
                  const devices = Object.values(states)
                    .filter((item) => item.entity_id.endsWith('_linkquality'))
                    .sort((a, b) => {
                      const nameA = a.attributes.friendly_name || a.entity_id;
                      const nameB = b.attributes.friendly_name || b.entity_id;
                      return nameA.localeCompare(nameB);
                    });
                  const escapeXml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&apos;'
                  })[character]);
                  const left = devices.slice(0, Math.ceil(devices.length / 2));
                  const right = devices.slice(Math.ceil(devices.length / 2));
                  const rowCount = Math.max(left.length, right.length, 1);
                  const height = Math.max(300, rowCount * 74 + 120);
                  const centerY = height / 2;
                  const top = 50;
                  const bottom = height - 70;
                  const yFor = (index, count) => count < 2
                    ? centerY
                    : top + index * (bottom - top) / (count - 1);
                  const renderDevice = (item, index, side) => {
                    const isLeft = side === 'left';
                    const x = isLeft ? 285 : 715;
                    const y = yFor(index, side === 'left' ? left.length : right.length);
                    const name = (item.attributes.friendly_name || item.entity_id)
                      .replace(/\s+Linkquality$/i, '');
                    const displayName = name.length > 27 ? `${name.slice(0, 24)}...` : name;
                    const numericValue = Number(item.state);
                    const value = Number.isFinite(numericValue) ? String(numericValue) : '--';
                    const color = !Number.isFinite(numericValue)
                      ? '#9e9e9e'
                      : numericValue < 50
                        ? '#db4437'
                        : numericValue <= 99
                          ? '#f9a825'
                          : '#43a047';
                    const labelX = isLeft ? 18 : 982;
                    const valueX = x + (isLeft ? 20 : -20);
                    const anchor = isLeft ? 'start' : 'end';
                    const startX = 500 + (isLeft ? -68 : 68);
                    return `<g>
                      <title>${escapeXml(name)}: ${escapeXml(value)}</title>
                      <line x1="${startX}" y1="${centerY}" x2="${x}" y2="${y}" stroke="${color}" stroke-width="2" stroke-opacity="0.65"/>
                      <circle cx="${x}" cy="${y}" r="10" fill="${color}"/>
                      <text x="${labelX}" y="${y + 5}" text-anchor="${anchor}" fill="var(--primary-text-color)" font-size="17">${escapeXml(displayName)}</text>
                      <text x="${valueX}" y="${y + 5}" text-anchor="${isLeft ? 'start' : 'end'}" fill="${color}" font-size="17" font-weight="bold">${escapeXml(value)}</text>
                    </g>`;
                  };
                  const links = [
                    ...left.map((item, index) => renderDevice(item, index, 'left')),
                    ...right.map((item, index) => renderDevice(item, index, 'right'))
                  ].join('');
                  const emptyMessage = devices.length
                    ? ''
                    : `<text x="500" y="${centerY + 105}" text-anchor="middle" fill="var(--secondary-text-color)" font-size="17">No link-quality entities found</text>`;
                  const legendY = height - 24;
                  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 ${height}" style="display:block;width:100%;min-width:720px;height:auto">
                    ${links}
                    <circle cx="500" cy="${centerY}" r="68" fill="var(--card-background-color)" stroke="var(--primary-color)" stroke-width="3"/>
                    <text x="500" y="${centerY - 5}" text-anchor="middle" fill="var(--primary-text-color)" font-size="20" font-weight="bold">Zigbee</text>
                    <text x="500" y="${centerY + 21}" text-anchor="middle" fill="var(--secondary-text-color)" font-size="15">hub</text>
                    ${emptyMessage}
                    <circle cx="26" cy="${legendY - 5}" r="7" fill="#db4437"/>
                    <text x="40" y="${legendY}" fill="var(--primary-text-color)" font-size="14">0-49</text>
                    <circle cx="110" cy="${legendY - 5}" r="7" fill="#f9a825"/>
                    <text x="124" y="${legendY}" fill="var(--primary-text-color)" font-size="14">50-99</text>
                    <circle cx="220" cy="${legendY - 5}" r="7" fill="#43a047"/>
                    <text x="234" y="${legendY}" fill="var(--primary-text-color)" font-size="14">100-255</text>
                    <text x="500" y="${legendY}" text-anchor="middle" fill="var(--secondary-text-color)" font-size="14">${devices.length} entities - illustrative connections</text>
                  </svg>`;
                ]]]
            styles:
              card:
                - padding: 12px
                - overflow: auto
              grid:
                - grid-template-areas: '"topology"'
                - grid-template-columns: 1fr
                - grid-template-rows: 1fr
              custom_fields:
                topology:
                  - width: 100%
                  - justify-self: stretch
        column_span: 4
