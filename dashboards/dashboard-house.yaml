# lovelace_gen
views:
  - title: Home
    sections:
      - type: grid
        cards:
          - !include snippet-clock.yaml
        column_span: 3
      - type: grid
        cards:
          - type: heading
            heading: Downstairs
          - type: horizontal-stack
            cards: !include floorplan-downstairs.yaml
            grid_options:
              columns: full
          - type: heading
            heading: Upstairs
          - type: horizontal-stack
            cards: !include floorplan-upstairs.yaml
            grid_options:
              columns: full
          - type: heading
            heading: Who's Home
          - type: horizontal-stack
            cards:
              - !include
                - button-presence.yaml
                - entity: person.simon
                  name: Simon
              - !include
                - button-presence.yaml
                - entity: person.debbie
                  name: Debbie
              - !include
                - button-presence.yaml
                - entity: person.harrison
                  name: Harry
              - !include
                - button-presence.yaml
                - entity: person.amy
                  name: Amy
            grid_options:
              columns: full
        column_span: 2
      - type: grid
        cards:
          - type: heading
            heading: Weather
          - type: weather-forecast
            show_current: true
            show_forecast: true
            entity: weather.forecast_home
            forecast_type: daily
          - type: heading
            heading: Power
          - !include snippet-power.yaml
          - type: heading
            heading: To-do
          - !include snippet-tasks.yaml
          - type: heading
            heading: Calendar
          - !include snippet-calendar.yaml
          - type: custom:button-card
            name: Full Calendar
            icon: mdi:calendar-month
            show_name: true
            show_icon: false
            show_state: false
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Show Full Calendar
                  initial_style: fullscreen
                  content: !include snippet-calendar-month.yaml
        column_span: 1
      - type: grid
        cards:
          - !include snippet-battery.yaml
        column_span: 3
