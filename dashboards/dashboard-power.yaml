views:
  - title: Power Flow
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Power Flow
            heading_style: title
          - !include snippet-power.yaml
          - type: horizontal-stack
            grid_options:
              columns: full
            cards:
              - type: markdown
                content: >-
                  <ha-icon icon="{{ state_attr('sensor.weather_today_condition', 'icon') }}"></ha-icon>**Today (generated / forecast)**  

                  {% if has_value('sensor.solar_energy_today') and
                  has_value('sensor.solcast_pv_forecast_forecast_today') %}
                  {{ states('sensor.solar_energy_today') | float | round(1) }} kWh / {{ states('sensor.solcast_pv_forecast_forecast_today') | float | round(1) }} kWh
                  {% else %}
                  Generation or forecast unavailable
                  {% endif %}
              - type: markdown
                content: >-
                  <ha-icon icon="{{ state_attr('sensor.weather_tomorrow_condition', 'icon') }}"></ha-icon>**Tomorrow (forecast)**  

                  {% if has_value('sensor.solcast_pv_forecast_forecast_tomorrow') %}
                  {{ states('sensor.solcast_pv_forecast_forecast_tomorrow') | float | round(1) }} kWh
                  {% else %}
                  Forecast unavailable
                  {% endif %}
        column_span: 4
