# lovelace_gen
type: custom:button-card
entity: {{ entity }}
show_name: false
show_state: true
{% if icon is defined %}
show_icon: true
icon: "{{ icon }}"
{% if size is defined %}
size: {{ size }}
{% else %}
size: clamp(1.5em, 2.5vw, 2em)
{% endif %}
{% else %}
show_icon: false
{% endif %}
style:
  left: {{ x }}
  top: {{ y }}
{% if icon is defined %}
  width: clamp(5em, 10vw, 6em)
{% endif %}
styles:
  state:
    - font-size: >-
        [[[ return window.matchMedia('(max-width: 600px)').matches ? '0.65em' : '1em'; ]]]
  card:
    - border-color: transparent
    - background-color: transparent
    - text-shadow: -1px -1px 0 black, 1px -1px 0 black, -1px 1px 0 black, 1px 1px 0 black;
tap_action:
{% if popup is defined %}
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      title: {{ title }}
      content: !include {{ popup }}
{% else %}
  action: none
{% endif %}
hold_action:
  action: none
