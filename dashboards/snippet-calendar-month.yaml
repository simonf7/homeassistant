# lovelace_gen
type: custom:calendar-card-pro
entities:
  - entity: calendar.simonf21_gmail_com
    label: Simon
  - entity: calendar.family
    label: Family
  - entity: calendar.family_birthdays
    label: Birthdays
  - entity: calendar.myschedule_rota
    label: Amy
    accent_color: '#ffaaaa'
  - entity: calendar.webcal_teamer_net_teams_121353_norwich_ice_events_subscription_ics_e8bc56
