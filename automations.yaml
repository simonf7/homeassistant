- id: '1736024836154'
  alias: TV on, sofa on, set TV lights 100%
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - remote.50ex750_series
    - media_player.50ex750_series
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 1
    from: unavailable
  conditions:
  - condition: state
    entity_id: light.sofa
    state: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 1
  actions:
  - data:
      entity_id: light.tv_lights
      brightness: 255
    action: light.turn_on
  mode: single
