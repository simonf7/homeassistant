power_on_television:
  sequence:
    - action: remote.send_command
      metadata: {}
      target:
        entity_id: remote.harmony
      data:
        device: '54522812'
        command: PowerOn
  alias: Power On Television
  description: ''
power_off_television:
  sequence:
    - action: remote.send_command
      metadata: {}
      target:
        entity_id: remote.harmony
      data:
        device: '54522812'
        command: PowerOff
  alias: Power Off Television
  description: ''

git_maintenance:
  sequence:
    - action: shell_command.git_maintenance
  alias: Maintain Git repository
  description: Compact local Git objects without removing commit history.
